spring.application.name=security-service
server.port=8081

spring.datasource.url=jdbc:${DB_SUBPROTOCOL:mysql}://${DB_HOST:localhost}:${DB_PORT}/${DB_DATABASE_NAME}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET_BASE64}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.expiration-seconds=1800


